# Local dev bus for a2a/web, mirroring the operator's rendered nats.conf on
# the points that matter to this UI: the websocket listener and the read-only
# `web` user's exact grant list (W6.1 addendum, spec-nats-deployment.md "web
# read surface"). The app users here are a dev convenience for seeding; the
# install's deny-by-default lists are the real ones.
#
# PLAYGROUND POSTURE, stated out loud: static plaintext credentials, plain ws,
# no TLS, localhost only. Production terminates TLS in front of the bus or
# keeps the listener off; nothing here is the product's auth story.
#
# Run:  nats-server -c dev/nats.conf
port: 4222
http: 8222

websocket {
  port: 9222
  no_tls: true
}

jetstream {
  store_dir: /tmp/a2a-web-dev-js
}

accounts {
  APP: {
    jetstream: enabled
    users = [
      {
        # seed: provisions streams and publishes the replayed beat. Dev-only
        # convenience breadth, like the install's seed user.
        user: seed
        password: "dev-seed"
        permissions {
          publish { allow = [ "a2a.>", "$JS.API.>", "$JS.ACK.>", "$JS.FC.>", "_INBOX.seed.>" ] }
          subscribe { allow = [ "a2a.>", "_INBOX.seed.>" ] }
        }
      }
      {
        # web: byte-for-byte the install's read surface. Subscribe-everything,
        # publish-nothing beyond the JetStream read API.
        user: web
        password: "dev-web"
        permissions {
          publish { allow = [
            "$JS.API.INFO",
            "$JS.API.STREAM.NAMES",
            "$JS.API.STREAM.LIST",
            "$JS.API.STREAM.INFO.*",
            "$JS.API.CONSUMER.CREATE.>",
            "$JS.API.CONSUMER.INFO.*.*",
            "$JS.API.CONSUMER.NAMES.*",
            "$JS.API.CONSUMER.LIST.*",
            "$JS.API.CONSUMER.MSG.NEXT.*.*",
            "$JS.ACK.>",
            "$JS.FC.>",
            "_INBOX.web.>"
          ] }
          subscribe { allow = [
            "a2a.>",
            "_INBOX.web.>"
          ] }
        }
      }
    ]
  }
}
