# Build the worker-next session-pod image. Context is the a2a/ module
# directory.
#
#   gcloud builds submit --config cloudbuild-worker.yaml \
#     --substitutions _IMAGE=northamerica-northeast1-docker.pkg.dev/bnaylor-kagents-dev/a2a-demo/worker-next:w4-20260831 .
#
# Cloud Build rather than a local docker: deployment targets are amd64 GKE
# nodes, and the multi-arch bases otherwise resolve to the build host.
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--platform"
      - "linux/amd64"
      - "-t"
      - "$_IMAGE"
      - "-f"
      - "Dockerfile.worker"
      - "."
images:
  - "$_IMAGE"
options:
  logging: CLOUD_LOGGING_ONLY
