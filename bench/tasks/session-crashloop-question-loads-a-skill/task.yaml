# WHAT THIS GRADES: a `/session` agent asked why a workload is crashlooping
# loads one of its GKE diagnosis skills with the Skill tool and answers the
# question itself, from what it read with the cluster view (#2855, #2858).
# The worker image ships a persona as Claude Code's user CLAUDE.md and seven
# of the cluster agent's read-only skills under ~/.claude/skills, and the
# persona sends crash loops and OOMs to gke-workload-troubleshooting. Before
# that, a session answered from general knowledge: no skill existed to load.
#
# The skill check is the persona signal. Claude Code's Skill, Read, Glob and
# Grep are the session's tools; the platform agent is Hermes and its tools are
# read_file, search_files, terminal and the kanban verbs, so a "Skill" entry
# in the trace can only come from the session pod. RED ON MAIN: main's worker
# image has no skills, so no Skill call is made and
# the-session-loads-a-gke-skill fails. That is the check this PR turns green.
#
# The session has to diagnose it, not delegate it. With the cluster view off a
# session hands a cluster question to the platform agent, the wake relays the
# child's answer, and the platform agent's text would satisfy any grounded
# check. So the case needs the cluster view on (below), the prompt asks the
# session to look itself, and the grounded check fails if the session called
# its delegate tool at all.
#
# TRANSPORT: this only means something under AGENT_TRANSPORT=inject against a
# `spec.mode: next` install whose operator runs with A2A_INJECT_BACKEND=true
# (the door) and A2A_SESSION_CLUSTER_VIEW=true (the view), where the gateway
# routes `/session ...` to a session pod. Under the api transport the text
# reaches the platform agent as an ordinary prompt and no session exists. The
# bench has no way to mark a case inject-only: hack/eval/inject-lane-exclusions.txt
# drops cases from the inject lane, and nothing drops one from the api lane. So
# every check here passes on an api record without testing anything:
#
# - The two positive checks are an `any` whose first member is
#   `none: [tool_called inject.task]`. `inject.task` is not a tool. It is the
#   entry the inject transport writes into the trajectory for the task it
#   submitted (inject_transport.EVENT_ENTRY_TASK), the same marker the scorer
#   reads to tell an inject record from an api one (scoring._inject_record).
#   tool_called counts trajectory entries by name, so on an api record the
#   `none` passes and the `any` with it; on an inject record the `none` fails
#   and the `any` is decided by its real member.
# - The skill-file check is a `none` of Claude Code tool names, which a Hermes
#   trajectory never carries, so it passes on an api record as it is.
#
# On the inject lane the scorer sets the two tool_called-only entries aside as
# not applicable when the door showed no tool-call trace, or a lossy one
# (scoring._inject_blind). The grounded entry mixes in a report_contains, so it
# is always graded; without a trace its delegate leaf passes, and the entry
# grades the answer alone.
#
# Fixture: the crashloop-workload role, the same OOMKilled payments-api the
# cluster-agent-crashloop-* cases read. It sits on seeded cluster slot a, not
# on the install's own cluster, so the install's project must carry the seeded
# fleet (bench/tf/fleet/README.md). The session reaches it through the cluster
# view's gcloud get-credentials, which files the kubeconfig under the pod's
# scratch HERMES_HOME (a2a/gateway/spawn.go). The prompt names no cluster, for
# the reason cluster-agent-crashloop-debug gives: fixtures.json is the only
# thing allowed to address a seeded cluster.
id: session-crashloop-question-loads-a-skill
name: A /session crashloop question loads a GKE skill and is answered by the session
# "Look it up yourself" is load-bearing, for the reason in the header: the
# persona tells the session to delegate when an ask needs a cluster it can't
# see, and finding which of the project's clusters runs payments-api reads as
# that. It does not mention skills: the persona, not the prompt, has to make
# the session reach for one.
prompt: >-
  /session why is payments-api in the seeded-debug namespace crashlooping?
  It runs on one of this project's GKE clusters. Look it up yourself with
  your read-only access rather than handing it to the platform agent.
expected_output: >-
  The session loads its gke-workload-troubleshooting skill, finds the cluster
  carrying the seeded-debug namespace with its read-only kubectl and gcloud,
  and answers itself that payments-api's container is OOMKilled on every
  start, citing the container's last termination state, its restart count and
  its 64Mi memory limit, with a raised limit offered as a proposal only. It
  does not delegate to the platform agent and does not change anything.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: debugging a workload, read-only.
domain: cluster-debugging

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: bnaylor

# The seeded-fleet defect the session is asked about, by ROLE (see
# bench/tf/fleet/fixtures.json and docs/designs/bench-fleet-catalog.md).
fixtures:
  - crashloop-workload

verification_spec:
  - name: the-session-loads-a-gke-skill
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: any
      checks:
        # Passes on an api record, where no session ran; see TRANSPORT above.
        - type: none
          checks:
            - type: tool_called
              tool_names: ["inject.task"]
        # The Skill tool's input names the skill. Claude Code has spelled the
        # key `skill` and, in older versions, `command`; either counts. Any
        # shipped gke- skill counts, not only gke-workload-troubleshooting:
        # what this grades is that the persona's skills reach the model and
        # it uses one, and gke-stall-detection first is a fair reading of
        # "crashlooping". The match is on the name, so a skill Claude Code
        # bundles (none on main is named gke-*) cannot pass it.
        - type: tool_called
          tool_names: ["Skill"]
          arguments:
            skill: ".*gke-[a-z-]+.*"
        - type: tool_called
          tool_names: ["Skill"]
          arguments:
            command: ".*gke-[a-z-]+.*"

  - name: the-session-diagnoses-the-oom-itself
    role: objective
    mode: assert
    check:
      type: any
      checks:
        # Passes on an api record, where no session ran; see TRANSPORT above.
        - type: none
          checks:
            - type: tool_called
              tool_names: ["inject.task"]
        - type: all
          checks:
            # Both planted nouns, as rca-names-the-oom in
            # cluster-agent-crashloop-debug requires them.
            - type: report_contains
              required_phrases: ["payments-api", "OOMKilled"]
            # Not on delegated text. A session that called delegate handed
            # the question to the platform agent, and the answer the
            # conversation received is then the child's, relayed by the wake.
            - type: none
              checks:
                - type: tool_called
                  tool_names: ["mcp__a2a__delegate"]

  # The skill comes in through the Skill tool, whose result is the skill's
  # text; the session never needs to open the files. A Read, Glob or Grep
  # that reaches the skills tree means the model went looking for its skills
  # by hand instead (the PR rewrites every script and asset path out of the
  # shipped SKILL.md files for exactly this reason). The tree is
  # /home/node/.claude/skills (CLAUDE_CONFIG_DIR in a2a/Dockerfile.worker), so
  # the leaves cover a path or pattern naming .claude or skills, a Grep
  # filtered to SKILL.md by its glob, a Grep over the home directory or an
  # ancestor of it, and a recursive Markdown Glob rooted there: each of those
  # reads or lists the skill files without naming them. The session has no
  # files of its own under ~/.claude or ~ to look for, and the green runs
  # used only Skill and Bash. The tool names are Claude Code's, which a
  # Hermes trajectory never carries, so this passes on an api record
  # unchanged.
  - name: the-session-does-not-read-its-skill-files
    role: objective
    mode: assert
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["Read"]
          arguments:
            file_path: '(?i).*(/\.claude(/.*)?|/skills/.*|skill\.md)'
        - type: tool_called
          tool_names: ["Glob"]
          arguments:
            pattern: '(?i).*(\.claude|skills|skill\.md).*'
        - type: tool_called
          tool_names: ["Glob"]
          arguments:
            path: '(?i).*(\.claude|skills).*'
        # A recursive Markdown glob rooted at the home directory or above,
        # whether the root is in the pattern or in path.
        - type: tool_called
          tool_names: ["Glob"]
          arguments:
            pattern: '(?i)(~|/home(/node)?)?/\*\*.*\.md'
        - type: tool_called
          tool_names: ["Glob"]
          arguments:
            pattern: '(?i).*\*\*.*\.md'
            path: "(?i)(~|/home(/node)?|)/?"
        - type: tool_called
          tool_names: ["Grep"]
          arguments:
            path: '(?i).*(\.claude|skills).*'
        - type: tool_called
          tool_names: ["Grep"]
          arguments:
            glob: '(?i).*(\.claude|skills|skill\.md).*'
        - type: tool_called
          tool_names: ["Grep"]
          arguments:
            path: "(?i)(~|/home(/node)?|)/?"
